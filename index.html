    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct);
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
    try{
      const ageH=(Date.now()-PUB_TS)/3600000;
      if(ageH>24){
        const days=Math.floor(ageH/24);
        const ru="\u26a0 \u0414\u0430\u043d\u043d\u044b\u0435 \u043c\u043e\u0433\u043b\u0438 \u0443\u0441\u0442\u0430\u0440\u0435\u0442\u044c (\u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u043e "+(days>=1?days+" \u0434\u043d. \u043d\u0430\u0437\u0430\u0434":"\u0431\u043e\u043b\u0435\u0435 \u0441\u0443\u0442\u043e\u043a \u043d\u0430\u0437\u0430\u0434")+"). \u041e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443.";
        const en="\u26a0 Data may be outdated (updated "+(days>=1?days+" day(s) ago":"over a day ago")+"). Please refresh.";
        const bar=document.createElement("div");
        bar.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99999;background:#DC2626;color:#fff;padding:10px 14px;font:600 13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer";
        bar.textContent=ru+"  |  "+en;
        bar.onclick=()=>location.reload(true);
        document.body.appendChild(bar);
      }
    }catch(e){}
  }catch(e){err.textContent="Неверный пароль / Wrong password";}
}
